<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RSA Enrollment 1024-bit</title>
  <script src="https://cdn.jsdelivr.net/npm/jsencrypt@latest/bin/jsencrypt.min.js"></script>
  <link rel="stylesheet" href="sursa.css">
</head>
<body>
  <div class="container">
    <h1>RSA Enrollment Form</h1>
    <div id="formPanel">
      <h2>Sign Up</h2>
      <input type="text" id="fullName" placeholder="Full Name">
      <input type="date" id="birthDate">
      <input type="text" id="yearLevel" placeholder="Year Level">
      <input type="text" id="gender" placeholder="Gender">
      <input type="text" id="username" placeholder="Username">
      <input type="password" id="password" placeholder="Password">

      <button onclick="SignUp()">Sign Up</button>

      <div id="message" class="message"></div>
    </div>

    <div id="resultPanel" class="panel">
      <h2>Original Enrollment Data</h2>
      <pre id="originalMessage"></pre>
      <h2>Encrypted Data</h2>
      <pre id="encryptedMessage"></pre>
      <h2>Decrypted Data</h2>
      <pre id="decryptedMessage"></pre>
    </div>
  </div>
  <script src="sursa.js"></script>
</body>
</html>
